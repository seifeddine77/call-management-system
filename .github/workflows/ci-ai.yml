# ============================================================
# 🐍 CI — AI Service (Python FastAPI + Whisper + RAG)
# ============================================================
name: 🐍 CI — AI Service

on:
  push:
    branches: [main, develop]
    paths: ['services/ai-service/**']
  pull_request:
    paths: ['services/ai-service/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/autoassist-ai

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-service/requirements.txt

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Lint (Ruff)
        run: |
          pip install ruff
          ruff check . --output-format=github
        continue-on-error: true

      - name: 🧪 Run Tests
        run: |
          pip install pytest pytest-cov pytest-asyncio
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:///./test.db
          WHISPER_MODEL: tiny
          LLM_API_KEY: test
          LLM_BASE_URL: http://localhost:11434/v1

      - name: 📊 Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ai-service
          path: services/ai-service/coverage.xml
          retention-days: 7

      # ── Docker ──
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: services/ai-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
