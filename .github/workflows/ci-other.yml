# ============================================================
# 📱 CI — WhatsApp Service (Node.js) & Mobile App (Flutter)
# ============================================================
name: 📱 CI — WhatsApp & Mobile

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/whatsapp-service/**'
      - 'mobile/**'
  pull_request:
    paths:
      - 'services/whatsapp-service/**'
      - 'mobile/**'

env:
  REGISTRY: ghcr.io

jobs:
  # ── WhatsApp Service (Node.js) ──
  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/whatsapp-service/package-lock.json
      - run: npm ci
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🔑 Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: services/whatsapp-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/autoassist-whatsapp:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/autoassist-whatsapp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Mobile App (Flutter) ──
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 🔍 Analyze
        run: flutter analyze
        continue-on-error: true
      - name: 🧪 Test
        run: flutter test
        continue-on-error: true
      - name: 📦 Build Web
        run: flutter build web --release
      - name: 🐳 Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: 🔑 Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Build & Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: mobile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autoassist-mobile:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/autoassist-mobile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
