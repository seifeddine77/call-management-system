# ============================================================
# 💬 CI — WhatsApp Service (Node.js + Puppeteer)
# ============================================================
name: 💬 CI — WhatsApp Service

on:
  push:
    branches: [main, develop]
    paths: ['services/whatsapp-service/**']
  pull_request:
    paths: ['services/whatsapp-service/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/autoassist-whatsapp

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-service
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/whatsapp-service/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint (basic syntax check)
        run: node --check index.js
        continue-on-error: true

      # ── Docker ──
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: services/whatsapp-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
