# ============================================================
# 🔒 Security Scanning & Code Quality
# Runs weekly + on every push to main
# ============================================================
name: 🔒 Security & Quality

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════
  # Trivy — Container Vulnerability Scanning
  # ══════════════════════════════════════════
  trivy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
          - name: auth-service
            context: ./services/auth-service
          - name: organisation-service
            context: ./services/organisation-service
          - name: ticket-service
            context: ./services/ticket-service
          - name: rules-service
            context: ./services/rules-service
          - name: decision-service
            context: ./services/decision-service
          - name: notification-service
            context: ./services/notification-service
          - name: analytics-service
            context: ./services/analytics-service
          - name: eureka-server
            context: ./services/eureka-server
          - name: api-gateway
            context: ./services/api-gateway
          - name: ai-service
            context: ./services/ai-service
          - name: whatsapp-service
            context: ./services/whatsapp-service
    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Build image for scan
        run: docker build -t scan-${{ matrix.name }}:latest ${{ matrix.context }}

      - name: 🔍 Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'scan-${{ matrix.name }}:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📊 Trivy SARIF Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'scan-${{ matrix.name }}:latest'
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}.sarif'

      - name: 📤 Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.name }}.sarif'
        continue-on-error: true

  # ══════════════════════════════════════════
  # OWASP Dependency Check — Java Dependencies
  # ══════════════════════════════════════════
  owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 🛡️ OWASP Dependency Check
        run: |
          for svc in auth-service organisation-service ticket-service rules-service decision-service notification-service analytics-service eureka-server api-gateway; do
            echo "══════ Scanning $svc ══════"
            cd services/$svc
            mvn org.owasp:dependency-check-maven:check \
              -DskipTests -q \
              -DfailBuildOnCVSS=9 \
              || true
            cd ../..
          done
        continue-on-error: true

      - name: 📤 Upload OWASP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-reports
          path: services/*/target/dependency-check-report.html
          retention-days: 14

  # ══════════════════════════════════════════
  # Python Safety — AI Service Dependencies
  # ══════════════════════════════════════════
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🔍 Safety Check
        run: |
          pip install safety
          safety check -r services/ai-service/requirements.txt || true
        continue-on-error: true

  # ══════════════════════════════════════════
  # Secret Scanning — Detect leaked credentials
  # ══════════════════════════════════════════
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🔑 Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ══════════════════════════════════════════
  # Summary Report
  # ══════════════════════════════════════════
  summary:
    needs: [trivy, owasp, python-safety, secrets-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Docker) | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP (Java) | ${{ needs.owasp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety (Python) | ${{ needs.python-safety.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks (Secrets) | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
