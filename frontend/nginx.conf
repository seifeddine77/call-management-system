server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — prevents stale IP after container recreation
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Assets Vite (noms hachés) → cache long sûr (le hash change à chaque build).
    location ~* \.(js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html / routes SPA → jamais en cache, pour servir toujours la dernière build.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API proxy — variable forces DNS re-resolution on every request
    location /api {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
        allow all;
    }
}
