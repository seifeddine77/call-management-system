# ============================================================
# Alertmanager — Routes alerts to n8n webhook
# ============================================================
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'n8n-webhook'
  routes:
    # Critical → immediate notification
    - match:
        severity: critical
      receiver: 'n8n-webhook'
      group_wait: 10s
      repeat_interval: 1h
    # Warning → grouped
    - match:
        severity: warning
      receiver: 'n8n-webhook'
      group_wait: 1m
      repeat_interval: 4h

receivers:
  - name: 'n8n-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/prometheus-alert'
        send_resolved: true
