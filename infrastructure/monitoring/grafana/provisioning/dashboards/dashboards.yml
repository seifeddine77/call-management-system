# ============================================================
# Grafana Provisioning — Auto-load dashboards
# ============================================================
apiVersion: 1

providers:
  - name: 'AutoAssist Dashboards'
    orgId: 1
    folder: 'AutoAssist'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
