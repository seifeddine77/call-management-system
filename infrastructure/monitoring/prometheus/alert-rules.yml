# ============================================================
# Prometheus Alert Rules
# Triggers alerts → Alertmanager → n8n webhook
# ============================================================
groups:
  - name: service_health
    rules:
      # ── Service Down ──
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🔴 {{ $labels.job }} est DOWN"
          description: "Le service {{ $labels.job }} ({{ $labels.instance }}) ne répond plus depuis 1 minute."

      # ── High Response Time (>2s) ──
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ {{ $labels.job }} — Temps de réponse élevé"
          description: "P95 latency > 2s pour {{ $labels.job }} pendant 5 minutes."

      # ── High Error Rate (>5%) ──
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "🔴 {{ $labels.job }} — Taux d'erreurs >5%"
          description: "Plus de 5% des requêtes retournent des erreurs 5xx."

  - name: infrastructure
    rules:
      # ── High CPU Usage ──
      - alert: HighCPU
        expr: process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ {{ $labels.job }} — CPU > 80%"

      # ── High Memory (JVM) ──
      - alert: HighJVMMemory
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ {{ $labels.job }} — JVM Heap > 85%"

      # ── Database Connection Pool Exhausted ──
      - alert: DBPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "🔴 {{ $labels.job }} — Pool DB presque saturé"

      # ── RabbitMQ Queue Backed Up ──
      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ RabbitMQ — File d'attente > 1000 messages"

      # ── Disk Space Low ──
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "🔴 Espace disque < 15%"
