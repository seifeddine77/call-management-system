# ============================================================
# PostgreSQL Init — Create all databases on first startup
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: autoassist
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    echo "🗄️  Creating application databases..."

    for db in auth_db users_db tickets_db rules_db decisions_db notif_db analytics_db ai_db; do
      echo "  → Creating database: $db"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE $db'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done

    echo "✅ All databases created successfully!"
