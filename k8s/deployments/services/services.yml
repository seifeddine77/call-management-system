---
# ── AI Service (Python FastAPI) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: autoassist
  labels:
    app: ai-service
    tier: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/OWNER/autoassist-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: autoassist-config
            - secretRef:
                name: autoassist-secrets
          env:
            - name: WHISPER_MODEL
              value: base
          resources:
            requests: { memory: "512Mi", cpu: "500m" }
            limits: { memory: "1Gi", cpu: "1000m" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: autoassist
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000

---
# ── Frontend ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autoassist
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/autoassist-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autoassist
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
