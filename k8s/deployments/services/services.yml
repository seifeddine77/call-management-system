# ── AI Service (Python FastAPI) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: autoassist
  labels:
    app: ai-service
    tier: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 5; done']
        - name: wait-eureka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z eureka-server 8761; do echo waiting for eureka; sleep 5; done']
      containers:
        - name: ai-service
          image: localhost:5000/autoassist-ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: autoassist-config
            - secretRef:
                name: autoassist-secrets
          env:
            - name: WHISPER_MODEL
              value: base
            - name: POSTGRES_USER_VAL
              valueFrom:
                secretKeyRef:
                  name: autoassist-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD_VAL
              valueFrom:
                secretKeyRef:
                  name: autoassist-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER_VAL):$(POSTGRES_PASSWORD_VAL)@postgres:5432/ai_db
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: ai_db
            - name: EUREKA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: autoassist-config
                  key: EUREKA_URL
          resources:
            requests: { memory: "512Mi", cpu: "500m" }
            limits: { memory: "1536Mi", cpu: "1000m" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: autoassist
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000

---
# ── Frontend ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autoassist
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: localhost:5000/autoassist-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autoassist
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
