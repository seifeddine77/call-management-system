# ── Eureka Server (Service Discovery) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: autoassist
  labels:
    app: eureka-server
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 5; done']
      containers:
        - name: eureka-server
          image: localhost:5000/autoassist-eureka-server:latest
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: autoassist-config
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: autoassist
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761

---
# ── API Gateway ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: autoassist
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-eureka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z eureka-server 8761; do echo waiting for eureka; sleep 5; done']
        - name: wait-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 5; done']
      containers:
        - name: api-gateway
          image: localhost:5000/autoassist-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: autoassist-config
            - secretRef:
                name: autoassist-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: autoassist
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

