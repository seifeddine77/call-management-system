# ============================================================
# Microservices Deployments — Java Services + AI + Frontend
# ============================================================

# ── Eureka Server (Service Discovery) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: autoassist
  labels:
    app: eureka-server
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: ghcr.io/OWNER/autoassist-eureka-server:latest
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: autoassist-config
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: autoassist
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761

---
# ── API Gateway ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: autoassist
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/OWNER/autoassist-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: autoassist-config
            - secretRef:
                name: autoassist-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: autoassist
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

---
# ── Auth Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: autoassist
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/OWNER/autoassist-auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: autoassist-config
            - secretRef:
                name: autoassist-secrets
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/auth_db
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: autoassist
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081

