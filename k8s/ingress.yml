# ============================================================
# Ingress — Route external traffic to services
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoassist-ingress
  namespace: autoassist
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - autoassist.insy2s.com
      secretName: autoassist-tls
  rules:
    - host: autoassist.insy2s.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /eureka
            pathType: Prefix
            backend:
              service:
                name: eureka-server
                port:
                  number: 8761
