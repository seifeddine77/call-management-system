apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: autoassist
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
        scrape_interval: 10s

      - job_name: 'eureka-server'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['eureka-server:8761']
        scrape_interval: 10s

      - job_name: 'api-gateway'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway:8080']
        scrape_interval: 10s

      - job_name: 'auth-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['auth-service:8081']

      - job_name: 'organisation-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['organisation-service:8082']

      - job_name: 'ticket-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ticket-service:8083']

      - job_name: 'rules-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['rules-service:8084']

      - job_name: 'decision-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['decision-service:8085']

      - job_name: 'notification-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8086']

      - job_name: 'analytics-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['analytics-service:8087']

      - job_name: 'ai-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['ai-service:8000']

  alert-rules.yml: |
    groups:
      - name: service_health
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "🔴 {{ $labels.job }} est DOWN"
              description: "Le service {{ $labels.job }} ({{ $labels.instance }}) ne répond plus."
          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ {{ $labels.job }} — Temps de réponse élevé"
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "🔴 {{ $labels.job }} — Taux d'erreurs >5%"
