# ============================================================
# Secrets Template — NEVER commit real values!
# Copy this file and fill in your actual secrets:
#   kubectl create secret generic autoassist-secrets \
#     --from-literal=POSTGRES_USER=xxx \
#     --from-literal=POSTGRES_PASSWORD=xxx \
#     ...
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: autoassist-secrets
  namespace: autoassist
type: Opaque
stringData:
  # ── Database ──
  POSTGRES_USER: callmgmt
  POSTGRES_PASSWORD: CHANGE_ME
  SPRING_DATASOURCE_USERNAME: callmgmt
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME

  # ── Auth (JWT) ──
  JWT_SECRET: CHANGE_ME_GENERATE_A_STRONG_KEY
  JWT_REFRESH_SECRET: CHANGE_ME_GENERATE_ANOTHER_KEY

  # ── RabbitMQ ──
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: CHANGE_ME

  # ── Mail ──
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_USERNAME: CHANGE_ME
  MAIL_PASSWORD: CHANGE_ME

  # ── Twilio ──
  TWILIO_ACCOUNT_SID: CHANGE_ME
  TWILIO_AUTH_TOKEN: CHANGE_ME
  TWILIO_PHONE_NUMBER: CHANGE_ME

  # ── LLM ──
  LLM_API_KEY: docker-model-runner
  LLM_BASE_URL: http://model-runner:11434/v1
  LLM_MODEL: ai/gemma4
