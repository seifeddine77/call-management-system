server {
    listen 5555;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — forces re-resolution on each request
    # Prevents stale IP caching when containers are recreated
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression for Flutter assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 256;
    gzip_vary on;

    # Entrypoints Flutter Web : NE JAMAIS mettre en cache immuable.
    # Ces fichiers gardent le même nom à chaque build (non hashés) ; les figer
    # bloquerait toute mise à jour de l'app jusqu'à un vidage manuel du cache.
    # (bloc regex placé AVANT le cache agressif → priorité de correspondance)
    location ~* (flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|flutter\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Cache static assets aggressively (assets hashés/versionnés : polices, images, wasm…)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Flutter SPA fallback — all routes serve index.html (jamais en cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy to gateway (inside Docker network)
    # Using variable forces DNS re-resolution via resolver directive above
    location /api {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
