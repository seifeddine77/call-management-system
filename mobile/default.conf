server {
    listen 5555;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — forces re-resolution on each request
    # Prevents stale IP caching when containers are recreated
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression for Flutter assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 256;
    gzip_vary on;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Flutter SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to gateway (inside Docker network)
    # Using variable forces DNS re-resolution via resolver directive above
    location /api {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
