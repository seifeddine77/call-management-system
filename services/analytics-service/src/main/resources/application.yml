server:
  port: 8087

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/analytics_db
    username: ${POSTGRES_USER:callmgmt}
    password: ${POSTGRES_PASSWORD:callmgmt_secret_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Réconciliation des KPIs (défense en profondeur contre la perte d'événements)
analytics:
  reconciliation:
    # false = la passe nocturne détecte et loggue les écarts sans rien modifier (sûr par défaut).
    # true  = la passe nocturne corrige automatiquement les compteurs de création.
    auto-correct: ${ANALYTICS_RECONCILIATION_AUTO_CORRECT:false}
    # Fenêtre glissante (jours) réconciliée par la passe nocturne.
    window-days: ${ANALYTICS_RECONCILIATION_WINDOW_DAYS:30}
