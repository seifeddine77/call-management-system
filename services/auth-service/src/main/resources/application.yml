spring:
  application:
    name: auth-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:callmgmt}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:callmgmt_secret_2024}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true


  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pfe.callmgmt: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:default-access-secret-key-change-in-production-min-32-chars}
  refresh-secret: ${JWT_REFRESH_SECRET:default-refresh-secret-key-change-in-production-min-32-chars}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}  # 24h dev, override in prod
  refresh-expiration-ms: 604800000
