spring:
  application:
    name: auth-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

server:
  port: 0

eureka:
  client:
    enabled: false

feign:
  circuitbreaker:
    enabled: false

jwt:
  secret: test-access-secret-key-minimum-32-characters-for-hmac
  refresh-secret: test-refresh-secret-key-minimum-32-characters-for-hmac
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000
