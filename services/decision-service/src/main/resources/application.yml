server:
  port: 8085

spring:
  application:
    name: decision-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/decisions_db
    username: ${POSTGRES_USER:callmgmt}
    password: ${POSTGRES_PASSWORD:callmgmt_secret_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

# Resilience4j — Circuit Breaker pour appels LLM (Docker Model Runner)
resilience4j:
  circuitbreaker:
    instances:
      llm:
        register-health-indicator: true
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# LLM configuration — Docker Model Runner (compatible OpenAI API)
openai:
  api-key: ${OPENAI_API_KEY:docker-model-runner}
  model: ${OPENAI_MODEL:ai/gemma4}
  timeout-seconds: ${OPENAI_TIMEOUT:60}
  base-url: ${OPENAI_BASE_URL:http://localhost:12434/engines/llama.cpp/v1}

# Letters storage
letters:
  storage-path: ${LETTERS_STORAGE_PATH:/tmp/letters}

# Decision service custom configuration
decision:
  cache:
    ttl-seconds: 3600
  rules:
    confidence-threshold: 60.0
