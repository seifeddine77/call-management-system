<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Ticket</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7fa; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #BF360C, #F57C00); color: white; padding: 30px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .body { padding: 30px; color: #333; line-height: 1.6; }
        .info-box { background: #FFF3E0; border-left: 4px solid #F57C00; padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .info-box strong { color: #E65100; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .badge-call { background: #F3E5F5; color: #7B1FA2; }
        .badge-email { background: #FFF3E0; color: #BF360C; }
        .badge-web { background: #E0F2F1; color: #00695C; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; color: #555; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Nouveau Ticket</h1>
            <p style="margin: 5px 0 0; opacity: 0.9;">Action requise</p>
        </div>
        <div class="body">
            <h2>Un nouveau ticket vous a été assigné</h2>
            <div class="info-box">
                <p><strong>Numéro :</strong> <span th:text="${numero}">T-20250001</span></p>
                <p><strong>Client :</strong> <span th:text="${clientNom}">Nom du client</span></p>
                <p><strong>Canal :</strong>
                    <span th:if="${canal == 'CALL'}" class="badge badge-call">📞 Appel</span>
                    <span th:if="${canal == 'EMAIL'}" class="badge badge-email">📧 Email</span>
                    <span th:if="${canal == 'WEB'}" class="badge badge-web">🌐 Web</span>
                </p>
            </div>
            <p>Veuillez prendre en charge ce ticket dans les meilleurs délais.</p>
        </div>
        <div class="footer">
            <p>© 2026 AutoAssist — Notification automatique</p>
        </div>
    </div>
</body>
</html>
