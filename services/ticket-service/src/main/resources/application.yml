spring:
  application:
    name: ticket-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tickets_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:callmgmt}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:callmgmt_secret_2024}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Publisher confirms — le broker ACK/NACK chaque message publié ;
    # un NACK (perte côté broker) ou un message non routable est désormais loggué
    # au lieu d'être silencieux. Asynchrone : ne bloque pas convertAndSend.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # RGPD — effacement événementiel : rejeu borné avec backoff exponentiel si un
        # consommateur échoue (ex. ai-service momentanément down), puis abandon après
        # max-attempts pour éviter la boucle de message empoisonné.
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2000
          multiplier: 2
          max-interval: 30000
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: always
    include-binding-errors: always

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    enabled: ${EUREKA_ENABLED:true}
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pfe.callmgmt: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

# ════════════════════════════════════════
# TWILIO VoIP
# ════════════════════════════════════════
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  webhook-base-url: ${TWILIO_WEBHOOK_BASE_URL:http://localhost:8083}

# ════════════════════════════════════════
# EMAIL LISTENER (IMAP)
# ════════════════════════════════════════
email:
  listener:
    enabled: ${EMAIL_LISTENER_ENABLED:false}
    host: ${EMAIL_IMAP_HOST:imap.gmail.com}
    port: ${EMAIL_IMAP_PORT:993}
    username: ${EMAIL_IMAP_USERNAME:}
    password: ${EMAIL_IMAP_PASSWORD:}
    folder: INBOX
    poll-interval: 30000
    default-agence-id: ${EMAIL_DEFAULT_AGENCE_ID:4474a4ab-5409-4cc7-b45d-b70a45c28484}
    # Filtrage par mots-clés (séparer par virgule). Si vide = tous les emails
    keywords: ${EMAIL_KEYWORDS:demande,sinistre,commande,réclamation,pièce,assurance,devis,remboursement,garantie,contrat,probleme,problème,panne,réparation,reparation,voiture,véhicule,vehicule,moteur,boite,freins,casse,dommage,accident,remplacement,facture,urgence,urgent}
    # Ignorer les anciens emails non lus au démarrage
    skip-old-emails: ${EMAIL_SKIP_OLD:true}
