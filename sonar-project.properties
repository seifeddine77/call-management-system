# ============================================================
# SonarCloud Configuration — AutoAssist Call Management System
# ============================================================
sonar.organization=seifeddine77
sonar.projectKey=autoassist-call-management
sonar.projectName=AutoAssist Call Management System

# ── Source code (production code only — strict rules apply) ──
sonar.sources=\
  services/auth-service/src/main/java,\
  services/organisation-service/src/main/java,\
  services/ticket-service/src/main/java,\
  services/rules-service/src/main/java,\
  services/decision-service/src/main/java,\
  services/notification-service/src/main/java,\
  services/analytics-service/src/main/java,\
  services/eureka-server/src/main/java,\
  services/api-gateway/src/main/java,\
  services/ai-service/app,\
  frontend/src

# ── Test code (relaxed rules apply automatically) ──
sonar.tests=\
  services/auth-service/src/test/java,\
  services/organisation-service/src/test/java,\
  services/ticket-service/src/test/java,\
  services/rules-service/src/test/java,\
  services/decision-service/src/test/java,\
  services/notification-service/src/test/java,\
  services/analytics-service/src/test/java,\
  services/eureka-server/src/test/java,\
  services/api-gateway/src/test/java

# ── Global exclusions (generated, infra, config, mobile) ──
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/static/**,\
  mobile/**,\
  k8s/**,\
  infrastructure/**,\
  **/Dockerfile*,\
  **/*.yml,\
  **/*.yaml,\
  **/*.json,\
  **/*.xml,\
  **/*.properties,\
  **/*.sql,\
  **/*.md

# ── Test & non-business file exclusions from coverage metrics ──
sonar.coverage.exclusions=\
  **/*Test.java,\
  **/*IT.java,\
  **/*Spec.java,\
  **/test/**,\
  frontend/src/**/*.test.*,\
  frontend/src/**/*.spec.*,\
  **/dto/**,\
  **/entity/**,\
  **/config/**,\
  **/exception/**,\
  **/*Application.java,\
  **/client/**,\
  **/fallback/**

# ── Java settings ──
sonar.java.binaries=services/*/target/classes
sonar.java.source=17

# ── Coverage reports ──
sonar.coverage.jacoco.xmlReportPaths=services/*/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=services/ai-service/coverage.xml

# ── Quality Gate ──
sonar.qualitygate.wait=true
