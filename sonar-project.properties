# ============================================================
# SonarCloud Configuration — AutoAssist Call Management System
# ============================================================
sonar.organization=seifeddine77
sonar.projectKey=autoassist-call-management
sonar.projectName=AutoAssist Call Management System

# ── Source code (production code only — strict rules apply) ──
sonar.sources=\
  services/auth-service/src/main/java,\
  services/organisation-service/src/main/java,\
  services/ticket-service/src/main/java,\
  services/rules-service/src/main/java,\
  services/decision-service/src/main/java,\
  services/notification-service/src/main/java,\
  services/analytics-service/src/main/java,\
  services/eureka-server/src/main/java,\
  services/api-gateway/src/main/java,\
  services/ai-service/app,\
  frontend/src

# ── Test code (relaxed rules apply automatically) ──
sonar.tests=\
  services/auth-service/src/test/java,\
  services/organisation-service/src/test/java,\
  services/ticket-service/src/test/java,\
  services/rules-service/src/test/java,\
  services/decision-service/src/test/java,\
  services/notification-service/src/test/java,\
  services/analytics-service/src/test/java

# ── Global exclusions (generated, infra, config, mobile) ──
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/static/**,\
  mobile/**,\
  k8s/**,\
  infrastructure/**,\
  **/Dockerfile*,\
  **/*.yml,\
  **/*.yaml,\
  **/*.json,\
  **/*.xml,\
  **/*.properties,\
  **/*.sql,\
  **/*.md

# ── Test & non-business file exclusions from coverage metrics ──
sonar.coverage.exclusions=\
  frontend/src/**/*,\
  **/*Test.java,\
  **/*IT.java,\
  **/*Spec.java,\
  **/test/**,\
  frontend/src/**/*.test.*,\
  frontend/src/**/*.spec.*,\
  **/dto/**,\
  **/entity/**,\
  **/config/**,\
  **/exception/**,\
  **/mapper/**,\
  **/event/**,\
  **/*Application.java,\
  **/client/**,\
  **/fallback/**,\
  services/ai-service/app/rag/**/*,\
  services/ai-service/app/routers/streaming.py,\
  services/ai-service/app/routers/chat.py,\
  services/ai-service/app/routers/audio_stream.py,\
  services/ai-service/app/main.py

# ── Java settings ──
sonar.java.binaries=\
  services/auth-service/target/classes,\
  services/organisation-service/target/classes,\
  services/ticket-service/target/classes,\
  services/rules-service/target/classes,\
  services/decision-service/target/classes,\
  services/notification-service/target/classes,\
  services/analytics-service/target/classes,\
  services/api-gateway/target/classes,\
  services/eureka-server/target/classes
sonar.java.source=17

# ── Coverage reports (explicit paths — glob not supported by sonar-scanner CLI) ──
sonar.coverage.jacoco.xmlReportPaths=\
  services/auth-service/target/site/jacoco/jacoco.xml,\
  services/organisation-service/target/site/jacoco/jacoco.xml,\
  services/ticket-service/target/site/jacoco/jacoco.xml,\
  services/rules-service/target/site/jacoco/jacoco.xml,\
  services/decision-service/target/site/jacoco/jacoco.xml,\
  services/notification-service/target/site/jacoco/jacoco.xml,\
  services/analytics-service/target/site/jacoco/jacoco.xml,\
  services/api-gateway/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=services/ai-service/coverage.xml

# ── Quality Gate ──
sonar.qualitygate.wait=false
